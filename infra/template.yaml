AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Storage and alerting for the Balon d'Or ranking app's stats pipeline: an S3
  bucket holding raw WhoScored payloads and ranked summaries, plus an SNS topic
  for failure alerts. Fetching, aggregation and scheduling are NOT here - they
  run on a personal machine (scripts/stats_pipeline/, driven by cron), because
  WhoScored/Cloudflare answers AWS egress IPs with a flat 403. The Lambda +
  Step Functions pipeline that used to do that work has been removed; only the
  resources the script writes to and alerts through remain. The Django app
  (deployed separately on Vercel) only ever reads the summary from S3.

  No SAM/serverless resources remain, so this is plain CloudFormation. Deploy
  with `sam deploy --config-env dev --parameter-overrides AlertEmail=you@example.com`
  (see samconfig.toml) or `aws cloudformation deploy` directly.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage, used to namespace resource names.
  AlertEmail:
    Type: String
    Description: Email address subscribed to pipeline-failure alerts.

Resources:
  StatsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bdor-stats-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawPartsAfter90Days
            Prefix: raw/
            Status: Enabled
            ExpirationInDays: 90
          - Id: TransitionDatedSummariesToIA
            Prefix: summary/
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
          - Id: ExpireNoncurrentVersionsAfter30Days
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # --- Alerting ---
  #
  # Published to directly by the personal-machine script
  # (scripts/stats_pipeline/alerting.py) on any failed run - including the 403s
  # the removed CloudWatch metric-filter alarm used to watch for, which the
  # script now surfaces itself since its logs live on that machine, not in
  # CloudWatch. The topic ARN is configured in the script's .env; keep the two
  # in sync if this stack is redeployed under a different Stage/account/region.

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub bdor-stats-pipeline-alerts-${Stage}

  AlertTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

Outputs:
  StatsBucketName:
    Description: S3 bucket holding raw payloads and ranking summaries.
    Value: !Ref StatsBucket
  LatestSummaryKey:
    Description: Stable S3 key the Django app should GetObject for the latest ranking.
    Value: summary/latest_summary.json
  AlertTopicArn:
    Description: SNS topic ARN for the personal-machine script's SNS_ALERT_TOPIC_ARN setting.
    Value: !Ref AlertTopic
