# StatsUrl and AlertEmail have no defaults here (StatsUrl is passed with
# --no-echo in the template; AlertEmail shouldn't be hardcoded). Supply both
# on every deploy, e.g.:
#   sam deploy --config-env dev --parameter-overrides \
#     StatsUrl=https://... AlertEmail=you@example.com
version = 0.1

[default]
[default.build.parameters]
use_container = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true

[dev.deploy.parameters]
stack_name = "bdor-stats-pipeline-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Stage=dev ScheduleState=DISABLED"

[prod.deploy.parameters]
stack_name = "bdor-stats-pipeline-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Stage=prod ScheduleState=DISABLED"
