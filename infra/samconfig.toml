# AlertEmail has no default here (it shouldn't be hardcoded). Supply it on
# every deploy, e.g.:
#   sam deploy --config-env dev --parameter-overrides AlertEmail=you@example.com
#
# No build parameters: the stack is plain CloudFormation (an S3 bucket and an
# SNS topic) since the Lambda pipeline was removed, so there's nothing to
# `sam build`.
version = 0.1

[default]
[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true

[dev.deploy.parameters]
stack_name = "bdor-stats-pipeline-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Stage=dev"

[prod.deploy.parameters]
stack_name = "bdor-stats-pipeline-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Stage=prod"
